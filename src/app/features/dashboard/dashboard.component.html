<div class="layout">
  <aside class="sidebar">
    <div class="brand"><span class="logo">H</span><strong>HMS</strong></div>
    <nav>
      <a routerLink="/dashboard/patient" routerLinkActive="active">Patients</a>
      <a routerLink="/dashboard/staff" routerLinkActive="active">Staff</a>
      <a routerLink="/dashboard/provider" routerLinkActive="active">Providers</a>
      <a routerLink="/dashboard/biller" routerLinkActive="active">Billers</a>
    </nav>

  <section class="content">

  </section>
</div>
