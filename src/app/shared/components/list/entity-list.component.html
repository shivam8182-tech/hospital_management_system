<div class="toolbar">
  <input [(ngModel)]="search" placeholder="Search {{ type }}..." aria-label="Search">
</div>

<div class="table-wrap">
<table>
  <thead>
    <tr>
      <th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Status</th><th>Action</th>
    </tr>
  </thead>
  <tbody>
    @for (row of filteredRows; track row.id) {
      <tr>
        <td>{{ row.id }}</td>
        <td>{{ row.name }}</td>
        <td>{{ row.email }}</td>
        <td>{{ row.phone }}</td>
        <td><span class="status">{{ row.status | statusLabel }}</span></td>
        <td>
          <a class="details" [routerLink]="['/dashboard/details', token(row)]">Show Details</a>
        </td>
      </tr>
    } @empty {
      <tr><td colspan="6" class="empty">No records found.</td></tr>
    }
  </tbody>
</table>
</div>
